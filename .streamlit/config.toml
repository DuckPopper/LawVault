[theme]
base = "dark"
primaryColor = "#5bc5cf"
backgroundColor = "#0c1410"
secondaryBackgroundColor = "#112019"
textColor = "#e6fbf7"
borderColor = "#1f3a36"
linkColor = "#5bc5cf"
baseRadius = "10px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"

[theme.sidebar]
backgroundColor = "#0a110e"
secondaryBackgroundColor = "#112019"

[server]
maxUploadSize = 50           # MB - matches config.MAX_UPLOAD_MB
enableXsrfProtection = true

[client]
toolbarMode = "minimal"      # hides the developer "Deploy" menu

[browser]
gatherUsageStats = false
