<!doctype html>
<html><head><meta charset="utf-8">
<meta name="darkreader-lock">
<script>try{const s=getComputedStyle(window.parent.document.documentElement).colorScheme||"dark";document.documentElement.style.colorScheme=s;const m=document.createElement("meta");m.name="color-scheme";m.content=s;document.head.appendChild(m)}catch(e){}</script>

<style>
  html,body{margin:0;background:transparent;overflow:hidden;font-family:system-ui,sans-serif}
  #box{display:flex;justify-content:flex-start;padding:10px 4px 4px}
  #wheel{position:relative;width:200px;height:200px;border-radius:50%;touch-action:none;cursor:pointer;
    background:conic-gradient(from 0deg,hsl(0 80% 55%),hsl(60 80% 55%),hsl(120 80% 55%),hsl(180 80% 55%),hsl(240 80% 55%),hsl(300 80% 55%),hsl(360 80% 55%));
    -webkit-mask:radial-gradient(circle,transparent 58%,#000 59%);mask:radial-gradient(circle,transparent 58%,#000 59%)}
  #stage{position:relative;width:200px;height:200px}
  #dot{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:3px solid #fff;
    box-shadow:0 1px 6px rgba(0,0,0,.55);pointer-events:none}
  #mid{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;
    border:1px solid rgba(128,128,128,.4);pointer-events:none}
  .off #wheel{opacity:.35;cursor:not-allowed;filter:grayscale(.4)} .off #dot{display:none}
</style></head>
<body>
<div id="box"><div id="stage"><div id="wheel"></div><div id="mid"></div><div id="dot"></div></div></div>
<script>
const wheel=document.getElementById("wheel"), dot=document.getElementById("dot"), mid=document.getElementById("mid"), stage=document.getElementById("stage");
let hue=184, disabled=false, last=null, dragging=false;
const R=100, RING=(R*0.585+R)/2;           // the handle rides the middle of the ring
function send(type,extra){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type},extra),"*")}
function paint(){
  const a=(hue-90)*Math.PI/180;            // 0 deg (red) is at the top
  dot.style.left=(R+RING*Math.cos(a))+"px"; dot.style.top=(R+RING*Math.sin(a))+"px";
  const c="hsl("+hue+" 70% 52%)"; dot.style.background=c; mid.style.background=c;
}
function fromEvent(e){
  const r=stage.getBoundingClientRect(), x=e.clientX-(r.left+r.width/2), y=e.clientY-(r.top+r.height/2);
  hue=Math.round((Math.atan2(y,x)*180/Math.PI+90+360)%360)%360; paint();
}
wheel.addEventListener("pointerdown",e=>{ if(disabled)return; dragging=true; wheel.setPointerCapture(e.pointerId); fromEvent(e); });
wheel.addEventListener("pointermove",e=>{ if(dragging) fromEvent(e); });
const done=()=>{ if(!dragging)return; dragging=false;
  if(hue!==last){ last=hue; send("streamlit:setComponentValue",{value:hue,dataType:"json"}); } };
wheel.addEventListener("pointerup",done); wheel.addEventListener("pointercancel",done);
window.addEventListener("message",e=>{
  if(!e.data||e.data.type!=="streamlit:render")return;
  const a=e.data.args||{}; disabled=!!a.disabled; document.body.className=disabled?"off":"";
  if(!dragging&&typeof a.hue==="number"){ hue=a.hue; last=a.hue; paint(); }
});
send("streamlit:componentReady",{apiVersion:1}); send("streamlit:setFrameHeight",{height:220}); paint();
</script></body></html>
